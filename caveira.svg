<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Uma caveira de fone de ouvido programando em um notebook">
  <style>
    .code { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 16px; fill: #c9d1d9; white-space: pre; }
    .kw { fill: #ff7b72; } .cl { fill: #d2a8ff; } .st { fill: #a5d6ff; } .id { fill: #79c0ff; }
    .k { fill: #21262d; stroke: #30363d; stroke-width: 1.5; animation: tecla 3.3s infinite; }
    @keyframes tecla { 0%, 9%, 100% { fill: #21262d; } 3% { fill: #58a6ff; } }
    .mao { animation: bater .5s ease-in-out infinite alternate; }
    @keyframes bater { from { transform: translateY(0); } to { transform: translateY(4px); } }
    .cabeca { animation: balanca 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes balanca { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-3px); } }
    .mandibula { animation: mastigar .45s ease-in-out infinite alternate; }
    @keyframes mastigar { from { transform: translateY(0); } to { transform: translateY(4px); } }
    .olho { fill: #58a6ff; animation: brilho 2.4s ease-in-out infinite; }
    @keyframes brilho { 0%, 90%, 100% { opacity: 1; } 94% { opacity: .1; } 50% { opacity: .65; } }
    .c1 { animation: d1 9s infinite; } .c2 { animation: d2 9s infinite; }
    .c3 { animation: d3 9s infinite; } .c4 { animation: d4 9s infinite; }
    @keyframes d1 { 0% { width: 0; } 12% { width: 150px; } 100% { width: 150px; } }
    @keyframes d2 { 0%, 12% { width: 0; } 38% { width: 360px; } 100% { width: 360px; } }
    @keyframes d3 { 0%, 38% { width: 0; } 60% { width: 290px; } 100% { width: 290px; } }
    @keyframes d4 { 0%, 60% { width: 0; } 84% { width: 420px; } 100% { width: 420px; } }
    .reset { animation: apagar 9s infinite; }
    @keyframes apagar { 0%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .cursor { fill: #58a6ff; animation: piscar 1s steps(1) infinite; }
    @keyframes piscar { 50% { opacity: 0; } }
  </style>
  <defs>
